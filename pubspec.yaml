name: muscle_memory
description: "MUSCLEMORY - トレーニングの記録を次の成長につなげるアプリ。"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  supabase_flutter: ^2.17.2
  interactive_3d:
    path: packages/interactive_3d
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/body_tab.glb
    - assets/models/forms/
    - assets/models/form_chunks/
    - assets/models/bench_press.glb
    - assets/models/incline_dumbbell_press.glb
    - assets/category_muscles/
    - assets/sounds/rest_complete.wav
